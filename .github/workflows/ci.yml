name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check-and-test:
    name: Check & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Build release
        run: cargo build --release

      - name: Size gate (Unix)
        if: runner.os != 'Windows'
        run: |
          size=$(stat -c%s target/release/ezcmd 2>/dev/null || stat -f%z target/release/ezcmd)
          echo "Release binary size: $size bytes (limit: 3145728 bytes)"
          if [ "$size" -gt 3145728 ]; then
            echo "Error: Binary exceeds 3 MB limit"
            exit 1
          fi

      - name: Size gate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $size = (Get-Item target/release/ezcmd.exe).Length
          Write-Host "Release binary size: $size bytes (limit: 3145728 bytes)"
          if ($size -gt 3145728) {
            Write-Error "Binary exceeds 3 MB limit"
            exit 1
          }
