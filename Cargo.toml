[package]
name = "ezcmd"
version = "0.1.0"
edition = "2021"

[dependencies]
strsim = "0.11"
terminal_size = "0.4"

[target.'cfg(windows)'.dependencies]
enable-ansi-support = "0.2"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
insta = "1.42"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
