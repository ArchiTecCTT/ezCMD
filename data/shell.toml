tool = "shell"

[[section]]
title   = "Navigating Directories"
aliases = ["change directory", "cd commands", "switch directory", "navigate folders"]

  [[section.command]]
  note    = "Shows current working directory"
  windows = "cd"
  unix    = "pwd"

  [[section.command]]
  note = "Changes to specified folder"
  cmd  = "cd <folder>"

  [[section.command]]
  note = "Moves up to parent folder"
  cmd  = "cd .."

  [[section.command]]
  note    = "Moves to root directory"
  windows = "cd \\"
  unix    = "cd /"

  [[section.command]]
  note    = "Clears the terminal screen"
  windows = "cls"
  unix    = "clear"

[[section]]
title   = "Creating Folders & Files"
aliases = ["create folder", "make file", "create file", "new folder"]

  [[section.command]]
  note = "Creates a new folder"
  cmd  = "mkdir <folder>"

  [[section.command]]
  note    = "Creates a new empty file"
  windows = "type nul > <file>"
  unix    = "touch <file>"

[[section]]
title   = "Removing Folders & Files"
aliases = ["delete folder", "remove directory", "delete file", "remove files"]

  [[section.command]]
  note = "Removes an empty folder"
  cmd  = "rmdir <folder>"

  [[section.command]]
  note    = "Removes a folder and all its contents"
  windows = "rmdir /s /q <folder>"
  unix    = "rm -rf <folder>"

  [[section.command]]
  note    = "Deletes a file"
  windows = "del <file>"
  unix    = "rm <file>"

